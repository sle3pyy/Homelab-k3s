apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-1'

spec:
  description: Homelab applications

  sourceRepos:
    - https://github.com/sle3pyy/Homelab-k3s.git
    - https://dl.gitea.com/charts/
    - https://jellyfin.github.io/jellyfin-helm
    - https://bitnami.github.io/sealed-secrets

  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: gitea
    - server: https://kubernetes.default.svc
      namespace: jellyfin
    - server: https://kubernetes.default.svc
      namespace: navidrome
    - server: https://kubernetes.default.svc
      namespace: arr
    - server: https://kubernetes.default.svc
      namespace: kube-system

  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: ''
      kind: PersistentVolume
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
