apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-1'

spec:
  description: Homelab applications

  sourceRepos:
    - https://github.com/sle3pyy/Homelab-k3s.git
    - https://dl.gitea.com/charts/
    - https://jellyfin.github.io/jellyfin-helm

  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: gitea
    - server: https://kubernetes.default.svc
      namespace: jellyfin

  clusterResourceWhitelist:
    - group: ''
      kind: Namespace

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
