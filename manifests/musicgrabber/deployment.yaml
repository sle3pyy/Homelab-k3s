apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: musicgrabber-data
  namespace: arr
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: musicgrabber
  namespace: arr
  labels:
    app.kubernetes.io/name: musicgrabber
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: musicgrabber
  template:
    metadata:
      labels:
        app.kubernetes.io/name: musicgrabber
    spec:
      initContainers:
        - name: prepare-music-directory
          image: busybox:1.36
          command:
            - sh
            - -c
            - chown -R 1000:1000 /music && chmod -R u+rwX,g+rwX /music
          volumeMounts:
            - name: music
              mountPath: /music
      containers:
        - name: musicgrabber
          image: g33kphr33k/musicgrabber:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: MUSIC_DIR
              value: /music
            - name: DB_PATH
              value: /data/music_grabber.db
            - name: ENABLE_MUSICBRAINZ
              value: "true"
            - name: ENABLE_LYRICS
              value: "true"
            - name: DEFAULT_CONVERT_TO_FLAC
              value: "true"
            - name: NAVIDROME_URL
              value: http://navidrome.navidrome.svc.cluster.local:4533
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
            - name: music
              mountPath: /music
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: musicgrabber-data
        - name: music
          hostPath:
            path: /media/music
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: musicgrabber
  namespace: arr
  labels:
    app.kubernetes.io/name: musicgrabber
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: musicgrabber
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30274
